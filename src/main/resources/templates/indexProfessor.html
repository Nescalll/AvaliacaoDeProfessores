<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/avaliacaoProfessor.css">
    <title>Área do Professor</title>
</head>
<body>
    <div id="container">
        <!-- Cabeçalho do Professor -->
        <div class="info-professor">
            <h1><span id="nomeProfessor">Carregando...</span></h1>
        </div>
        
        <!-- Conteúdo Principal -->
        <div id="informacoes">
            <div class="principal">
                <!-- Card Nota -->
                <div class="avaliacao" id="nota">
                    <div class="icon-card">⭐</div>
                    <div class="info-card">
                        <div class="label">Sua Nota</div>
                        <div class="value" id="notaValor">Carregando...</div>
                        <div class="sub">Última avaliação</div>
                    </div>
                </div>
                
                <!-- Card Melhorias -->
                <div class="avaliacao" id="melhorias">
                    <div class="icon-card">🚀</div>
                    <div class="info-card">
                        <div class="label">Melhorias</div>
                        <div class="value" id="melhoriasValor">Carregando...</div>
                        <div class="sub">Sugestões para evolução</div>
                    </div>
                </div>
            </div>
            
            <!-- Gráfico e Legenda -->
            <div class="chart-wrapper">
                <canvas id="pieChart" width="300" height="300"></canvas>
                <div class="legend" id="legend"></div>
            </div>
        </div>
        
        <!-- Botão Logout -->
        <div id="button">
            <button type="submit" class="btn-logout">Sair</button>
        </div>
    </div>

    <script src="../static/js/indexProfessor.js"></script>
</body>
</html>
