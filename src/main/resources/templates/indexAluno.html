<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../static/css/indexAluno.css">
    <title>Avaliação da aula</title>
</head>
<body>
    <div id="professores">
        <div id="titulo">
            <p>Professores</p>
        </div>
        <div id="allProfessor">

        </div>
        <div id="paginacao">
            <button id="anterior" class="paginar"> < </button>
            <p id="numeroDaPagina"></p>
            <button id="proximo" class="paginar"> > </button>
        </div>
    </div>

    <div id="AvaliarAula">
        <div id="nota">
            <div class="titulo">
                <h2>A nota desse professor é:</h2>
            </div>
            <div class="opcoes">
                <div class="notas">
                    <div id="nota-1" class="nota nota-1">1</div>
                    <div id="nota-2" class="nota nota-2">2</div>
                    <div id="nota-3" class="nota nota-3">3</div>
                    <div id="nota-4" class="nota nota-4">4</div>
                    <div id="nota-5" class="nota nota-5">5</div>
                </div> 
                <div class="notas">
                    <div id="nota-6" class="nota nota-6">6</div>
                    <div id="nota-7" class="nota nota-7">7</div>
                    <div id="nota-8" class="nota nota-8">8</div>
                    <div id="nota-9" class="nota nota-9">9</div>
                    <div id="nota-10" class="nota nota-10">10</div>
                </div>
            </div>
        </div>
        <div id="comentario"> 
            <div class="titulo">
                <h2>Deixe um comentário:</h2>
            </div>
            <div id="enviarComentario">
                <input type="text" id="comentarioInput">
            </div>
        </div>
        <div id="avaliar">
            <button type="submit" id="btn-avaliar">Avaliar</button>
        </div>
    </div>
    <div id="deslogar">
        <button type="submit" id="logout">deslogar</button>
    </div>
    <script src="../static/js/indexAluno.js"></script>
</body>
</html>
